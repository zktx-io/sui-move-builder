name: Deploy and Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Add WASM target manually
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install wasm-opt (Binaryen)
        env:
          BINARYEN_TAG: version_129
          BINARYEN_SHA256: 50b9fa62b9abea752da92ec57e0c555fee578760cd237c40107957715d2976ba
        run: |
          curl --fail --location --retry 3 --retry-delay 5 "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_TAG}/binaryen-${BINARYEN_TAG}-x86_64-linux.tar.gz" -o /tmp/binaryen.tar.gz
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum --check -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo cp "/tmp/binaryen-${BINARYEN_TAG}/bin/wasm-opt" /usr/local/bin/wasm-opt
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Install deps
        run: npm ci

      - name: Debug Rust env
        run: |
          rustup show
          rustc --version --verbose
          rustup target list --installed

      - name: Build package (js + wasm)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          access: public
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}
          package: "package.json"
          strategy: upgrade
